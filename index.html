<style>

  html,body{margin:0;height:100%;font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:#10192B;color:#fff;overflow:hidden;}
  #app{display:flex;flex-direction:column;height:100%;}
  header{background:var(--ink);padding:10px 14px;display:flex;align-items:center;gap:12px;flex-shrink:0;}
  header h1{font-size:17px;margin:0;font-weight:800;letter-spacing:.4px;}
  header .sub{color:var(--gold);font-size:12px;font-weight:700;}
  #tabs{display:flex;gap:6px;padding:8px 10px;background:#0C1422;flex-shrink:0;overflow-x:auto;}
  .tab{flex:1;min-width:88px;border:none;border-radius:10px;padding:10px 6px;font-size:14px;font-weight:800;color:#fff;opacity:.45;}
  .tab.active{opacity:1;box-shadow:0 0 0 2px #fff inset;}
  #main{display:flex;flex:1;min-height:0;}
  #list{width:220px;overflow-y:auto;background:#0C1422;padding:8px;flex-shrink:0;-webkit-overflow-scrolling:touch;}
  .chip{display:flex;align-items:center;gap:8px;width:100%;border:none;border-radius:9px;padding:9px 10px;margin-bottom:6px;
        background:#182338;color:#fff;font-size:13px;text-align:left;}
  .chip .code{font-weight:900;font-size:13px;background:#0C1422;border-radius:6px;padding:3px 7px;min-width:36px;text-align:center;}
  .chip.sel{outline:2px solid var(--gold);}
  .chip .nm{flex:1;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .chip .run{font-size:9px;font-weight:900;background:#B00020;border-radius:4px;padding:2px 4px;}
  #stage{flex:1;display:flex;flex-direction:column;min-width:0;}
  #fieldwrap{flex:1;position:relative;min-height:0;}
  canvas{position:absolute;inset:0;width:100%;height:100%;}
  #controls{display:flex;gap:8px;padding:8px 12px;background:#0C1422;align-items:center;flex-shrink:0;flex-wrap:wrap;}
  .btn{border:none;border-radius:10px;padding:12px 18px;font-size:16px;font-weight:900;color:#fff;background:#182338;}
  .btn.play{background:var(--gold);color:#10192B;min-width:110px;font-size:18px;}
  .btn.small{padding:10px 12px;font-size:14px;}
  #info{background:#0C1422;padding:10px 14px 14px;flex-shrink:0;max-height:32vh;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  #info h2{margin:0 0 2px;font-size:19px;}
  #info .meta{color:#9FB4CC;font-size:12px;font-weight:700;margin-bottom:6px;}
  #info .row{font-size:14px;line-height:1.45;margin-bottom:5px;}
  #info .lab{font-weight:900;letter-spacing:.3px;font-size:11px;margin-right:6px;padding:2px 6px;border-radius:4px;color:#fff;}
  .warn{display:inline-block;background:#B00020;color:#fff;font-weight:900;font-size:11px;border-radius:5px;padding:3px 7px;margin-top:2px;}
  @media (max-width:740px){
    #list{width:132px;}
    .chip .nm{display:none;}
    .chip{justify-content:center;}
  }
</style>
</head>

// resolve mirrors into concrete geometry
function geom(play, flip){
  let src = play.mirror ? byCode[play.base] : play;
  let doFlip = (play.mirror ? true : false) !== (!!flip); // XOR
  const fx = doFlip ? -1 : 1;
  const M = pts => pts.map(p=>[p[0]*fx, p[1]]);
  const g = {
    formation:{}, routes:{}, paths:[], mesh:(src.mesh||[]).map(m=>[m[0]*fx,m[1]]),
    motion: src.motion ? {player:src.motion.player, pts:M(src.motion.pts)} : null,
    primary: src.primary, run: play.run,
    formName: doFlip ? (FN[src.form]||'').replace('Right','§').replace('Left','Right').replace('§','Left') : (FN[src.form]||'')
  };
  for(const k in src.formation) g.formation[k]=[src.formation[k][0]*fx, src.formation[k][1]];
  for(const k in src.routes) g.routes[k]=M(src.routes[k]);
  (src.paths||[]).forEach(pa=>g.paths.push({player:pa.player, pts:M(pa.pts)}));
  return g;
}

// world coords: x -16.5..16.5, y -8.5..16.5 (y up)
function map(p){
  const wx=33, wy=25;
  const s = Math.min(W/wx, H/wy);
  const ox = W/2, oy = H - (8.5)*s - (H - wy*s)/2;
  return [ox + p[0]*s, oy - p[1]*s];
}
function scale(){ return Math.min(W/33, H/25); }

function polyLen(pts){let L=0;for(let i=1;i<pts.length;i++){L+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);}return L;}
function polyAt(pts,t){ // t 0..1
  const L=polyLen(pts); if(L===0) return pts[0];
  let d=t*L;
  for(let i=1;i<pts.length;i++){
    const seg=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);
    if(d<=seg){const f=seg?d/seg:0;return [pts[i-1][0]+(pts[i][0]-pts[i-1][0])*f, pts[i-1][1]+(pts[i][1]-pts[i-1][1])*f];}
    d-=seg;
  }
  return pts[pts.length-1];
}

// ---------- state ----------
let curSeries='X', curPlay=null, flip=false, showRoutes=true;

// timeline (seconds at 1x): idle .4 | motion 1.2 (if any) | snap .3 | action 2.6 | hold .8
function timeline(g){
  const mo = g.motion ? 1.2 : 0;
  return {idle:.4, motion:mo, snap:.3, action:2.6, hold:.9,
          total:.4+mo+.3+2.6+.9};
}

function playerTrack(g, who){
  // returns full polyline the player follows during ACTION phase, and start pos incl. motion
  let start = g.formation[who].slice();
  if(g.motion && g.motion.player===who) start = g.motion.pts[g.motion.pts.length-1].slice();
  let pts=null;
  const pa = g.paths.find(p=>p.player===who);
  if(pa) pts = pa.pts;
  else if(g.routes[who]) pts = g.routes[who];
  if(!pts) return {start, pts:[start]};
  // ensure track starts at start
  const first = pts[0];
  if(Math.hypot(first[0]-start[0], first[1]-start[1])>0.05) pts=[start,...pts];
  return {start, pts};
}

function posAt(g, who, t){
  const tl = timeline(g);
  const f = g.formation[who];
  if(t < tl.idle) return f;
  t-=tl.idle;
  if(g.motion && g.motion.player===who){
    if(t < tl.motion) return polyAt([f, ...g.motion.pts], Math.min(1,t/tl.motion));
  }
  if(t < tl.motion){ return f; }
  t-=tl.motion;
  const tr = playerTrack(g, who);
  if(t < tl.snap) return tr.start;
  t-=tl.snap;
  if(who==='Q') return f; // QB stays (no QB runs in our league)
  const u = Math.min(1, t/tl.action);
  return polyAt(tr.pts, u);
}

function ballAt(g, t){
  const tl = timeline(g);
  const q = g.formation['Q'], c = g.formation['C'];
  if(t < tl.idle + tl.motion) return c;               // ball with center
  let t2 = t - tl.idle - tl.motion;
  if(t2 < tl.snap) return polyAt([c,q], t2/tl.snap);  // snap
  t2 -= tl.snap;
  if(g.run){
    // hand/pitch: fly to carrier over .35s then stick with carrier
    const carrier = g.primary;
    const cp = posAt(g, carrier, t);
    if(t2 < .35){ const f=t2/.35; return [q[0]+(cp[0]-q[0])*f, q[1]+(cp[1]-q[1])*f]; }
    return cp;
  } else {
    const rel=.62, fly=.4;
    const tr = playerTrack(g, g.primary);
    const target = tr.pts[tr.pts.length-1];
    if(t2 < tl.action*rel) return q;
    const f = Math.min(1,(t2 - tl.action*rel)/fly);
    // arc
    const x=q[0]+(target[0]-q[0])*f, y=q[1]+(target[1]-q[1])*f + Math.sin(f*Math.PI)*2.2;
    return [x,y];
  }
}

function drawField(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#10192B'; ctx.fillRect(0,0,W,H);
  const tl=map([-16,16.5]), br=map([16,-8.5]);
  ctx.fillStyle='#EDF7ED';
  ctx.fillRect(tl[0],tl[1],br[0]-tl[0],br[1]-tl[1]);
  ctx.strokeStyle='#B9D8B9'; ctx.lineWidth=1.5;
  [5,10,15].forEach(yy=>{
    const a=map([-16,yy]),b=map([16,yy]);
    ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();
    ctx.fillStyle='#7BA37B'; ctx.font='700 10px -apple-system'; ctx.fillText(yy+' yd', a[0]+6, a[1]-4);
  });
  const a=map([-16,0]),b=map([16,0]);
  ctx.strokeStyle='#1B2A41'; ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();
  ctx.fillStyle='#1B2A41'; ctx.font='800 11px -apple-system'; ctx.fillText('LOS', b[0]-34, b[1]-6);
}
function drawPoly(ptsW, color, lw, dash){
  if(ptsW.length<2)return;
  ctx.save();
  ctx.strokeStyle=color; ctx.lineWidth=lw; ctx.lineCap='round'; ctx.lineJoin='round';
  if(dash) ctx.setLineDash(dash);
  ctx.beginPath();
  ptsW.forEach((p,i)=>{const m=map(p); i?ctx.lineTo(m[0],m[1]):ctx.moveTo(m[0],m[1]);});
  ctx.stroke();
  // arrowhead
  const n=ptsW.length, p1=map(ptsW[n-2]), p2=map(ptsW[n-1]);
  const ang=Math.atan2(p2[1]-p1[1],p2[0]-p1[0]), ah=6+lw;
  ctx.setLineDash([]);
  ctx.beginPath();
  ctx.moveTo(p2[0],p2[1]);
  ctx.lineTo(p2[0]-ah*Math.cos(ang-0.45), p2[1]-ah*Math.sin(ang-0.45));
  ctx.lineTo(p2[0]-ah*Math.cos(ang+0.45), p2[1]-ah*Math.sin(ang+0.45));
  ctx.closePath(); ctx.fillStyle=color; ctx.fill();
  ctx.restore();
}
function star(w, r, color){
  const m=map(w); ctx.save(); ctx.translate(m[0],m[1]); ctx.beginPath();
  for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5, rr=i%2?r*0.45:r;
    i?ctx.lineTo(rr*Math.cos(a),rr*Math.sin(a)):ctx.moveTo(rr*Math.cos(a),rr*Math.sin(a));}
  ctx.closePath(); ctx.fillStyle=color; ctx.fill();
  ctx.strokeStyle='#1B2A41'; ctx.lineWidth=1.2; ctx.stroke(); ctx.restore();
}

function draw(t){
  if(!curPlay){drawField();return;}
  const g = geom(curPlay, flip);
  const tl = timeline(g);
  drawField();
  const s = scale();

  // run warning
  if(g.run){
    ctx.fillStyle='#B00020';
    const m=map([0,15.6]);
    ctx.font='800 12px -apple-system';
    const txt='RUN PLAY — ILLEGAL IN NO-RUN ZONES';
    const w=ctx.measureText(txt).width;
    ctx.beginPath(); ctx.roundRect(m[0]-w/2-10, m[1]-14, w+20, 22, 8); ctx.fill();
    ctx.fillStyle='#fff'; ctx.fillText(txt, m[0]-w/2, m[1]+2);
  }

  // snap line
  {
    const c=map(g.formation['C']), q=map(g.formation['Q']);
    ctx.save(); ctx.strokeStyle='#8B98A8'; ctx.setLineDash([2,4]); ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(c[0],c[1]); ctx.lineTo(q[0],q[1]); ctx.stroke(); ctx.restore();
  }

  if(showRoutes){
    if(g.motion) drawPoly([g.formation[g.motion.player], ...g.motion.pts], PCOL[g.motion.player], 2, [6,5]);
    for(const who of ['C','X','Y','Z']){
      const tr = playerTrack(g, who);
      if(tr.pts.length>1){
        const prim = who===g.primary;
        drawPoly(tr.pts, PCOL[who], prim?4.5:2.2);
        if(prim) star(tr.pts[tr.pts.length-1], 9, '#F4B400');
      }
    }
    g.mesh.forEach(m=>{
      const p=map(m); ctx.save(); ctx.translate(p[0],p[1]); ctx.rotate(Math.PI/4);
      ctx.fillStyle='#fff'; ctx.strokeStyle='#1B2A41'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.rect(-4,-4,8,8); ctx.fill(); ctx.stroke(); ctx.restore();
    });
  }

  // players
  for(const who of ['C','X','Y','Z','Q']){
    const p = posAt(g, who, t), m=map(p);
    const prim = who===g.primary;
    if(prim){ctx.beginPath();ctx.arc(m[0],m[1],s*1.35,0,7);ctx.strokeStyle='#F4B400';ctx.lineWidth=3;ctx.stroke();}
    ctx.beginPath();ctx.arc(m[0],m[1],s*1.0,0,7);
    ctx.fillStyle=PCOL[who];ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle='#fff';ctx.font=`800 ${Math.max(11,s*1.05)}px -apple-system`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(who,m[0],m[1]+0.5);
    ctx.textAlign='start';ctx.textBaseline='alphabetic';
  }

  // ball
  {
    const b = ballAt(g,t), m=map(b);
    ctx.save(); ctx.translate(m[0],m[1]);
    ctx.beginPath(); ctx.ellipse(0,0,s*0.55,s*0.36,0.5,0,7);
    ctx.fillStyle='#7B4A21'; ctx.fill(); ctx.strokeStyle='#fff'; ctx.lineWidth=1.4; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-s*0.22,-s*0.1); ctx.lineTo(s*0.22,s*0.1);
    ctx.strokeStyle='#fff'; ctx.lineWidth=1.2; ctx.stroke();
    ctx.restore();
  }

  // completion flash
  if(t > tl.total - tl.hold + 0.1){
    ctx.fillStyle='rgba(27,42,65,0.85)';
    const m=map([0,-6.8]);
    const msg = g.run ? 'BALL CARRIER LOOSE!' : 'COMPLETE!';
    ctx.font='900 20px -apple-system';
    const w=ctx.measureText(msg).width;
    ctx.beginPath(); ctx.roundRect(m[0]-w/2-16, m[1]-22, w+32, 34, 10); ctx.fill();
    ctx.fillStyle='#F4B400'; ctx.fillText(msg, m[0]-w/2, m[1]+2);
  }
}

// ---------- animation ----------
function startAnim(){
  if(!curPlay) return;
  cancelAnimationFrame(anim);
  const g = geom(curPlay, flip);
  const tl = timeline(g);
  const t0 = performance.now();
  function step(now){
    curT = (now-t0)/1000 * speed;
    if(curT >= tl.total){ curT = tl.total; draw(curT); return; }
    draw(curT);
    anim = requestAnimationFrame(step);
  }
  anim = requestAnimationFrame(step);
}

// ---------- UI ----------
const tabsEl=document.getElementById('tabs'), listEl=document.getElementById('list'), infoEl=document.getElementById('info');
function buildTabs(){
  tabsEl.innerHTML='';
  for(const s of ['X','Y','Z','C','R']){
    const b=document.createElement('button');
    b.className='tab'+(s===curSeries?' active':'');
    b.style.background=SC[s];
    b.textContent=SNAMES[s];
    b.onclick=()=>{curSeries=s;buildTabs();buildList();};
    tabsEl.appendChild(b);
  }
}
function buildList(){
  listEl.innerHTML='';
  plays.filter(p=>p.series===curSeries).forEach(p=>{
    const b=document.createElement('button');
    b.className='chip'+(curPlay&&curPlay.code===p.code?' sel':'');
    const runTag = p.run?'<span class="run">RUN</span>':'';
    b.innerHTML=`<span class="code" style="color:${SC[p.series]}">${p.code}</span><span class="nm">${p.name}</span>${runTag}`;
    b.onclick=()=>{selectPlay(p);};
    listEl.appendChild(b);
  });
}
function selectPlay(p){
  curPlay=p; flip=false; curT=0;
  buildList(); renderInfo(); draw(0);
  startAnim();
}
function renderInfo(){
  if(!curPlay){infoEl.innerHTML='<div class="row">Tap a play, then press ▶ PLAY.</div>';return;}
  const g=geom(curPlay,flip);
  const sc=SC[curPlay.series];
  infoEl.innerHTML=`
    <h2>${curPlay.code} — ${curPlay.name} ${curPlay.mirror?'<span style="font-size:12px;color:#9FB4CC">(mirror of '+curPlay.base+')</span>':''}</h2>
    <div class="meta">${g.formName}${flip?' (FLIPPED)':''} • Ball goes to <b style="color:${PCOL[g.primary]}">${g.primary}</b> ★</div>
    ${g.run?'<div class="warn">RUN — never call inside a no-run zone</div>':''}
    <div class="row"><span class="lab" style="background:${sc}">QB READ</span>${curPlay.read}</div>
    <div class="row"><span class="lab" style="background:${sc}">BEST VS</span>${curPlay.best}</div>
    <div class="row"><span class="lab" style="background:${sc}">COACH</span>${curPlay.coach}</div>`;
}
document.getElementById('btnPlay').onclick=()=>startAnim();
document.getElementById('btnSpeed').onclick=(e)=>{
  const i=(SPEEDS.indexOf(speed)+1)%SPEEDS.length; speed=SPEEDS[i];
  e.target.textContent=speed+'x';
};
document.getElementById('btnFlip').onclick=()=>{flip=!flip;renderInfo();draw(0);startAnim();};
document.getElementById('btnRoutes').onclick=(e)=>{showRoutes=!showRoutes;e.target.textContent='Routes: '+(showRoutes?'ON':'OFF');draw(curT);};

buildTabs(); buildList(); renderInfo();
resize();
selectPlay(plays.find(p=>p.code==='X1'));
</script>
<script>
if ("serviceWorker" in navigator) { navigator.serviceWorker.register("./sw.js"); }
</script>
